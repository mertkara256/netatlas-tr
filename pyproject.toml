[project]
name = "netatlas-tr"
version = "0.1.0"
description = "Data pipeline for the NetAtlas TR home-internet atlas"
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "openpyxl",
    "pyarrow>=16",
    "rasterio>=1.4.4",
    "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# Beyond the defaults: long lines, whitespace, likely bugs (bugbear), import order, outdated syntax.
extend-select = ["E501", "W", "B", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pipeline/tests"]

name: Test, build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the running check; on main, deploys finish in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The map tiles and the JSON files are too large for git. They live in the release named in
      # web/data-release.txt, so the site and the pipeline tests below use the same data.
      - name: Download the site data
        run: gh release download "$(cat web/data-release.txt)" --dir web/public/data
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: astral-sh/setup-uv@v10.3.0
      - name: Test the data pipeline
        run: uv run --locked pytest

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Build the site
        run: npm run build
        working-directory: web
        env:
          # GitHub Pages serves the site under /<repo>/ on <owner>.github.io.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
